{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Sign In - Night City</title>
    <link href="[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css)" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'core/style.css' %}">
</head>
<body class="bg-dark text-light">
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card p-4 bg-black text-light border-warning" style="width: 100%; max-width: 420px;">
        <h3 class="text-warning text-center mb-3">ADMIN SIGN-IN</h3>
        <p class="text-secondary text-center small mb-3">Superuser credentials required</p>

        {% if form.non_field_errors %}
            <div class="alert alert-danger py-2 small">
                {% for error in form.non_field_errors %}
                    {{ error }}<br>
                {% endfor %}
            </div>
        {% endif %}

        <form method="post" novalidate>
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label text-warning small">Username</label>
                <input type="text" name="username" class="form-control bg-dark text-light border-secondary" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label text-warning small">Password</label>
                <input type="password" name="password" class="form-control bg-dark text-light border-secondary" required>
            </div>
            <button type="submit" class="btn btn-warning w-100 fw-bold mt-2">Sign In</button>
        </form>
    </div>
</div>
</body>
</html>
