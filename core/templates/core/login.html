{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Sign In - Night City</title>
    <link href="[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css)" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'core/style.css' %}">
</head>
<body style="background-color: #0b1118; margin: 0; min-height: 100vh; display: flex; flex-direction: column;">

    <!-- Navbar matching your home page -->
    <nav class="navbar navbar-expand-lg cyber-nav">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand cyber-brand" href="{% url 'home' %}">Project Night City</a>
            <div>
                <a class="nav-link cyber-link d-inline-block text-warning fw-bold" href="{% url 'home' %}">Return Home</a>
            </div>
        </div>
    </nav>

    <!-- Centered Card Container -->
    <div style="flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px;">
        <div style="width: 100%; max-width: 440px; background-color: #4a0000; border: 2px solid #ffd700; box-shadow: 0 0 25px rgba(255, 215, 0, 0.25); padding: 32px;">
            
            <h2 class="text-warning text-center fw-bold mb-2" style="letter-spacing: 2px;">ADMIN SIGN-IN</h2>
            <p class="text-center text-light small mb-4">Superuser credentials required</p>

            {% if form.non_field_errors %}
                <div class="alert alert-danger py-2 small mb-3">
                    {% for error in form.non_field_errors %}
                        {{ error }}
                    {% endfor %}
                </div>
            {% endif %}

            <form method="post" novalidate>
                {% csrf_token %}
                
                <div style="margin-bottom: 18px;">
                    <label style="display: block; color: #ffd700; font-weight: bold; margin-bottom: 6px; font-size: 14px;">Username</label>
                    <input type="text" name="username" required autofocus style="width: 100%; padding: 10px; background-color: #0b1118; color: #fff; border: 1px solid #ffd700; outline: none; box-sizing: border-box;">
                </div>

                <div style="margin-bottom: 24px;">
                    <label style="display: block; color: #ffd700; font-weight: bold; margin-bottom: 6px; font-size: 14px;">Password</label>
                    <input type="password" name="password" required style="width: 100%; padding: 10px; background-color: #0b1118; color: #fff; border: 1px solid #ffd700; outline: none; box-sizing: border-box;">
                </div>

                <button type="submit" style="width: 100%; padding: 12px; background-color: #ffd700; color: #000; font-weight: bold; border: none; cursor: pointer; letter-spacing: 1px;">
                    SIGN IN
                </button>
            </form>
        </div>
    </div>

</body>
</html>
