{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Tech Stack - Dashboard</title>
    <link href="[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css)" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'core/style.css' %}">
</head>
<body class="bg-dark text-light">
<div class="container py-5" style="max-width: 500px;">
    <div class="card bg-black border-warning p-4">
        <h3 class="text-warning mb-3">Add Tech Stack</h3>
        <form method="post" novalidate>
            {% csrf_token %}
            
            <div class="mb-3">
                <label class="form-label text-warning">Tech Stack Name *</label>
                {{ form.name }}
                {% if form.name.errors %}
                    <div class="text-danger small">{{ form.name.errors }}</div>
                {% endif %}
            </div>

            <div class="d-flex justify-content-between">
                <a href="{% url 'dashboard_tech_stacks' %}" class="btn btn-outline-secondary">Cancel</a>
                <button type="submit" class="btn btn-warning fw-bold">Save Tech Stack</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
