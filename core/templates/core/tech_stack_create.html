{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Tech Stack - Project Night City</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'core/style.css' %}">
</head>
<body>

    <nav class="navbar navbar-expand-lg cyber-nav">
        <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
            <a class="navbar-brand cyber-brand mb-0" href="{% url 'home' %}">Project Night City</a>
            <div style="display: flex; gap: 18px; align-items: center; flex-wrap: wrap;">
                <a class="nav-link cyber-link" href="{% url 'home' %}">Introduction</a>
                <a class="nav-link cyber-link" href="{% url 'skills' %}">Skills</a>
                <a class="nav-link cyber-link" href="{% url 'project_list' %}">Projects</a>
                <a class="nav-link cyber-link" href="{% url 'personal_information' %}">Personal Info</a>
                <a class="nav-link cyber-link" href="{% url 'inquiry_create' %}">Contact</a>
                <a class="nav-link cyber-link" href="{% url 'testimony_list' %}">Testimonies</a>
                <a class="nav-link cyber-link text-warning fw-bold" href="{% url 'dashboard' %}">Dashboard</a>
            </div>
        </div>
    </nav>

    <div class="container" style="max-width: 600px; margin: 60px auto 40px auto;">

        <div class="intro-box" style="padding: 28px;">
            <p class="intro-label mb-2" style="font-size: 0.8rem;">ADMIN PANEL</p>
            <h1 class="intro-title mb-4" style="font-size: 1.8rem;">ADD TECH STACK</h1>

            <form method="post" novalidate>
                {% csrf_token %}

                <div style="margin-bottom: 20px;">
                    <label style="display: block; color: #ffd700; font-weight: bold; font-size: 0.85rem; margin-bottom: 5px;">
                        Tech Stack Name *
                    </label>
                    <input type="text" name="name" value="{{ form.name.value|default:'' }}"
                           placeholder="e.g., Python" required
                           style="width: 100%; padding: 9px; background-color: #0b1118; color: #fff; border: 1px solid #ffd700; box-sizing: border-box;">
                    {% if form.name.errors %}
                        <div class="text-danger small mt-1">{{ form.name.errors }}</div>
                    {% endif %}
                </div>

                <div style="display: flex; gap: 12px;">
                    <button type="submit"
                            style="background-color: #ffd700; color: #000; padding: 10px 24px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">
                        SAVE TECH STACK
                    </button>
                    <a href="{% url 'dashboard_tech_stacks' %}"
                       style="background-color: #4a0000; color: #ffd700; padding: 10px 24px; border-radius: 4px; border: 2px solid #ffd700; font-weight: bold; text-decoration: none;">
                        CANCEL
                    </a>
                </div>
            </form>
        </div>

    </div>

</body>
</html>
